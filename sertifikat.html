<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sertifikat Kuis | Erikson Bible Studio</title>
  <meta name="description" content="Sertifikat pribadi pemain Kuis Alkitab Erikson Bible Studio.">
  <link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b3562">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/bible-studio-icon-512.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5fb;font-family:Arial,sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:30px 0 60px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top a{color:#f0c763;text-decoration:none;font-weight:800}.top h1{margin:0;font-family:Georgia,serif}.panel{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px}.preview{background:#fff;border-radius:20px;padding:12px;box-shadow:0 25px 70px #0008}.preview canvas{display:block;width:100%;height:auto;border-radius:12px}.editor{background:#102b48;border:1px solid #d8ab45aa;border-radius:20px;padding:20px;height:max-content}.editor h2{margin:0 0 6px;font-family:Georgia,serif}.editor p{margin:0 0 18px;color:#cbd9e5;font-size:13px;line-height:1.5}.editor label{display:block;margin:12px 0 5px;font-size:12px;font-weight:800;color:#f0c763}.editor input,.editor textarea{width:100%;border:1px solid #ffffff2a;border-radius:10px;padding:11px;background:#071728;color:#fff;font:inherit}.editor textarea{resize:vertical}.actions{display:grid;gap:9px;margin-top:18px}.actions button,.actions a{border:0;border-radius:11px;padding:13px;text-align:center;text-decoration:none;font-weight:900;cursor:pointer}.download{background:linear-gradient(135deg,#f4d27a,#d99d2b);color:#08233e}.print{background:#ffffff18;color:#fff}.empty{padding:60px 20px;text-align:center;background:#102b48;border-radius:20px}.empty a{color:#f0c763}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.meta span{background:#ffffff12;border-radius:99px;padding:6px 10px;font-size:11px}@media(max-width:760px){.panel{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding-top:18px}.editor{order:-1}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><a href="kuis.html">← Kembali ke kuis</a><h1>Sertifikat Pribadi</h1></div><img src="assets/bible-studio-icon-192.png" width="54" height="54" alt="Bible Studio"></div>
  <section id="certificateApp" class="panel" hidden>
    <div class="preview"><canvas id="certificateCanvas" width="1600" height="1131" aria-label="Pratinjau sertifikat"></canvas></div>
    <aside class="editor">
      <h2>Edit Sertifikat</h2><p>Nama dan hasil pemain ini berdiri sendiri. Admin dapat memperbaiki tulisan sebelum mengunduh.</p>
      <div class="meta"><span id="stageMeta">Tahap</span><span id="scoreMeta">Nilai</span><span id="dateMeta">Tanggal</span></div>
      <label for="certName">Nama penerima</label><input id="certName" maxlength="40">
      <label for="certTitle">Judul penghargaan</label><input id="certTitle" maxlength="70" value="Sertifikat Penyelesaian Kuis Alkitab">
      <label for="certMessage">Pesan sertifikat</label><textarea id="certMessage" rows="4" maxlength="180">Telah menyelesaikan tahap Kuis Alkitab dengan semangat belajar dan bertumbuh dalam Firman Tuhan.</textarea>
      <label for="certSigner">Nama penanda tangan</label><input id="certSigner" maxlength="40" value="Erikson Giawa">
      <div class="actions"><button class="download" id="downloadCertificate">Unduh Sertifikat PNG</button><button class="print" id="printCertificate">Cetak / Simpan PDF</button><a class="print" href="kuis.html">Main Tahap Lain</a></div>
    </aside>
  </section>
  <section id="emptyCertificate" class="empty" hidden><h2>Sertifikat belum ditemukan</h2><p>Selesaikan satu tahap kuis terlebih dahulu.</p><a href="kuis.html">Buka Kuis Alkitab</a></section>
</main>
<script src="sertifikat.js"></script><script src="pwa.js" defer></script>
</body></html>
